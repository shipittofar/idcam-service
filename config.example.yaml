# idCam development / mock-camera example.
# Do NOT copy this file to production as-is: it points at https://api.example.com.
# Production installs use deploy/config.yaml.template via sudo ./scripts/install.sh.

device_id: "pi5-doc-capture-001"

temp_dir: /var/lib/idcam/tmp

server:
  url: https://api.example.com
  path: /api/document
  connect_timeout_sec: 10
  read_timeout_sec: 60
  total_timeout_sec: 90
  verify_tls: true
  max_upload_bytes: 50000000

auth:
  type: bearer
  token: ""  # Prefer IDCAM_AUTH_TOKEN env var

storage:
  min_free_mb: 1024
  stale_temp_max_age_sec: 3600
  capture_reserve_mb: 200

state_timeouts:
  document_detected: 5
  waiting_for_stability: 15
  focusing: 10
  focus_verification: 5
  capturing: 45
  image_validation: 10
  uploading: 60
  waiting_for_server: 60
  processing_response: 10

camera:
  preview_width: 1920
  preview_height: 1080
  capture_width: 9152
  capture_height: 6944
  jpeg_quality: 95
  preview_fps: 5
  af_max_retries: 3
  af_timeout_sec: 10
  af_verify_max_retries: 2
  # Focus speed (docs/PERFORMANCE.md). Defaults shown; false/0 values restore the exhaustive procedure.
  af_adaptive: true              # skip the finest probe / confirmation when the peak is clean
  af_lens_memory: true           # start from the lens of the last validated capture
  af_memory_max_age_sec: 1800
  af_settle_by_metadata: true    # wait for LensPosition metadata (bounded by af_refine_settle_sec)
  af_refine_settle_sec: 0.3      # upper bound (and the fixed wait when metadata is off)
  af_refine_min_settle_sec: 0.12
  af_motion_max_unstable: 3      # inconsistent samples before waiting for the page to settle
  capture_timeout_sec: 45
  recovery:
    max_attempts: 3
    delay_seconds: 2

detection:
  roi_center_fraction: 0.7
  motion_threshold: 8.0
  edge_density_threshold: 0.02
  stable_frames_required: 8
  removal_frames_required: 10
  removal_motion_factor: 0.5
  removal_edge_factor: 0.5
  baseline_alpha: 0.05

quality:
  min_sharpness: 80.0
  min_file_bytes: 100000
  max_file_bytes: 50000000
  min_brightness: 30.0
  max_brightness: 225.0
  min_width: 640
  min_height: 480
  require_expected_dimensions: false
  dimension_tolerance: 64

logging:
  level: INFO
  log_dir: /var/log/idcam
  max_bytes: 10485760
  backup_count: 5
  json_format: true

ui:
  status_file: /run/idcam/status.json
  admin_socket: /run/idcam/admin.sock
  refresh_interval_sec: 0.5

watchdog:
  check_interval_sec: 1.0
  state_timeout_sec: 300

# Live Debug Viewer — off by default. Enabling exposes a live camera image
# over HTTP with no authentication. Do not enable on untrusted networks.
# Open http://<idcam-ip>:8088/preview/live when enabled.
debug:
  enabled: false
  host: 0.0.0.0
  port: 8088
  fps: 5.0
  jpeg_quality: 70
  max_width: 1280
  overlay: true

# WS2812B status LED strip (Raspberry Pi 5) — off by default.
# Needs the LED libraries: run the installer with --with-led.
# What the colours tell the user:
#   white         ready - place the document (stays white while it is detected, focused and
#                 captured, because the strip also lights the document)
#   blue blinking captured - checking and uploading, wait
#   green         uploaded (for a moment)
#   green blink   done - remove the document
#   white blink   failed again and again - remove the document, then place it again
#   red 2 s       capture or upload failed;  red blinking = error
#   yellow blink  recovering
led:
  enabled: false
  gpio_pin: 18          # BCM number of the data pin; GPIO18 is physical pin 12. Change it here.
  count: 30
  brightness: 0.2       # 0.0 - 1.0
  byteorder: GRB
  failure_flash_sec: 2.0
  illuminate_during_capture: true   # false = use a colour (cyan) while capturing instead of white
  # colors:             # optional [R, G, B] overrides per status
  #   starting: [0, 0, 255]
  #   ready: [255, 255, 255]
  #   working: [255, 255, 255]
  #   processing: [0, 0, 255]
  #   success: [0, 255, 0]
  #   remove: [255, 255, 255]
  #   failure: [255, 0, 0]
  #   recovering: [255, 255, 0]
  #   error: [255, 0, 0]
