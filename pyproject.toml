[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idcam"
version = "1.0.0"
description = "Production document capture for Raspberry Pi 5 + Arducam 64MP Hawkeye"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
]

[project.optional-dependencies]
pi = [
    "picamera2>=0.3.22",
]
led = [
    "Adafruit-Blinka>=8.0",
    "adafruit-circuitpython-pixelbuf>=2.0",
    "Adafruit-Blinka-Raspberry-Pi5-Neopixel>=1.0.0rc0",  # only pre-releases (1.0.0rcN) are published
    "Adafruit-Blinka-Raspberry-Pi-PWM>=1.0.2",  # Blinka asks for it on Pi 5; install it up front
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
]

[project.scripts]
idcam = "idcam.app.main:main"
idcam-admin = "idcam.app.admin:main"
idcam-long-run = "idcam.app.long_run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "hardware: requires Raspberry Pi with camera attached",
    "slow: slow integration test",
]

[tool.coverage.run]
source = ["idcam"]
